name: Deploy mobile games to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync puzzle assets from Android drawable
        run: |
          mkdir -p mobile-game/puzzle-assets
          cp android-puzzle/app/src/main/res/drawable/puzzle_photo_*.jpg mobile-game/puzzle-assets/ 2>/dev/null || true

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./mobile-game
