<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0a0e27" />
  <title>Aero Fall — Juego Móvil</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #0a0e27; touch-action: none; user-select: none;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #game { display: block; width: 100%; height: 100%; }
    #ui {
      position: fixed; top: 0; left: 0; right: 0; padding: 16px 20px;
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: none; z-index: 10;
    }
    #score { color: #fff; font-size: 28px; font-weight: 800; text-shadow: 0 2px 8px rgba(0,0,0,.5); }
    #best { color: rgba(255,255,255,.5); font-size: 14px; font-weight: 600; }
    #overlay {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 20;
      background: rgba(10,14,39,.75); backdrop-filter: blur(6px);
      transition: opacity .3s;
    }
    #overlay.hidden { opacity: 0; pointer-events: none; }
    #overlay h1 {
      font-size: clamp(36px, 10vw, 56px); font-weight: 900; color: #fff;
      text-align: center; line-height: 1.1; margin-bottom: 8px;
      background: linear-gradient(135deg, #ff6b6b, #ffd93d);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    #overlay p { color: rgba(255,255,255,.7); font-size: 16px; text-align: center; max-width: 280px; line-height: 1.5; margin-bottom: 32px; }
    #playBtn {
      padding: 16px 48px; font-size: 20px; font-weight: 800; color: #0a0e27;
      background: linear-gradient(135deg, #ffd93d, #ff6b6b);
      border: none; border-radius: 50px; cursor: pointer;
      box-shadow: 0 4px 24px rgba(255,107,107,.4);
      pointer-events: auto;
    }
    #playBtn:active { transform: scale(.95); }
    .final-score { font-size: 48px; font-weight: 900; color: #ffd93d; margin-bottom: 4px; }
    .hint {
      position: fixed; bottom: 24px; left: 0; right: 0; text-align: center;
      color: rgba(255,255,255,.35); font-size: 13px; pointer-events: none; z-index: 10;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui">
    <div id="score">0</div>
    <div id="best">Mejor: 0</div>
  </div>
  <div class="hint" id="hint">Toca izquierda / derecha para moverte</div>
  <div id="overlay">
    <h1>Aero Fall</h1>
    <p>Esquiva los obstáculos mientras caes. ¿Cuánto aguantas?</p>
    <button id="playBtn">JUGAR</button>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('overlay');
    const playBtn = document.getElementById('playBtn');
    const hint = document.getElementById('hint');

    let W, H, dpr;
    let state = 'menu';
    let score = 0, best = parseInt(localStorage.getItem('aeroFallBest') || '0');
    let frame = 0;
    let speed = 3;
    let shake = 0;

    bestEl.textContent = 'Mejor: ' + best;

    const plane = { x: 0, y: 0, w: 44, h: 36, vx: 0, tilt: 0 };
    let obstacles = [];
    let particles = [];
    let stars = [];
    let clouds = [];

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (state === 'menu') initBackground();
    }

    function initBackground() {
      stars = Array.from({ length: 80 }, () => ({
        x: Math.random() * W, y: Math.random() * H,
        r: Math.random() * 1.5 + .5, a: Math.random()
      }));
      clouds = Array.from({ length: 6 }, () => ({
        x: Math.random() * W, y: Math.random() * H,
        w: 60 + Math.random() * 80, speed: .3 + Math.random() * .5
      }));
    }

    function reset() {
      score = 0; frame = 0; speed = 3; shake = 0;
      scoreEl.textContent = '0';
      plane.x = W / 2; plane.y = H * 0.25;
      plane.vx = 0; plane.tilt = 0;
      obstacles = []; particles = [];
      initBackground();
    }

    function spawnObstacle() {
      const size = 28 + Math.random() * 24;
      const margin = size;
      obstacles.push({
        x: margin + Math.random() * (W - margin * 2),
        y: -size, size, rot: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - .5) * .06,
        type: Math.random() < .5 ? 'rock' : 'debris'
      });
    }

    function spawnParticles(x, y, color, n = 12) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = 2 + Math.random() * 5;
        particles.push({
          x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
          life: 1, color, size: 2 + Math.random() * 3
        });
      }
    }

    function drawPlane(x, y, tilt) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(tilt);
      ctx.shadowColor = '#ff6b6b';
      ctx.shadowBlur = 12;

      ctx.fillStyle = '#e8ecf4';
      ctx.beginPath();
      ctx.moveTo(22, -14);
      ctx.lineTo(-16, -6);
      ctx.lineTo(-20, 0);
      ctx.lineTo(-16, 6);
      ctx.lineTo(22, 14);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#ff6b6b';
      ctx.beginPath();
      ctx.moveTo(-8, -18);
      ctx.lineTo(-20, -22);
      ctx.lineTo(-14, -8);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-8, 18);
      ctx.lineTo(-20, 22);
      ctx.lineTo(-14, 8);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#4ecdc4';
      ctx.fillRect(8, -3, 14, 6);

      ctx.fillStyle = 'rgba(255,100,50,.8)';
      ctx.beginPath();
      ctx.moveTo(-22, -2);
      ctx.lineTo(-32 - Math.random() * 6, 0);
      ctx.lineTo(-22, 2);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    function drawObstacle(o) {
      ctx.save();
      ctx.translate(o.x, o.y);
      ctx.rotate(o.rot);
      if (o.type === 'rock') {
        ctx.fillStyle = '#6b7280';
        ctx.strokeStyle = '#9ca3af';
        ctx.lineWidth = 2;
        ctx.beginPath();
        const s = o.size / 2;
        for (let i = 0; i < 6; i++) {
          const a = (i / 6) * Math.PI * 2;
          const r = s * (.7 + Math.random() * .3);
          const px = Math.cos(a) * r, py = Math.sin(a) * r;
          i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill(); ctx.stroke();
      } else {
        ctx.fillStyle = '#f59e0b';
        ctx.fillRect(-o.size / 2, -o.size / 4, o.size, o.size / 2);
        ctx.fillStyle = '#92400e';
        ctx.fillRect(-o.size / 3, -o.size / 6, o.size * .6, o.size / 3);
      }
      ctx.restore();
    }

    function drawBackground() {
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, '#0a0e27');
      grad.addColorStop(.5, '#1a1040');
      grad.addColorStop(1, '#2d1b4e');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      stars.forEach(s => {
        s.y += s.r * .3;
        if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
        ctx.globalAlpha = s.a;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;

      clouds.forEach(c => {
        c.y += c.speed + speed * .15;
        if (c.y > H + 40) { c.y = -40; c.x = Math.random() * W; }
        ctx.fillStyle = 'rgba(255,255,255,.04)';
        ctx.beginPath();
        ctx.ellipse(c.x, c.y, c.w, c.w * .3, 0, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function update() {
      frame++;
      if (frame % 55 === 0) spawnObstacle();
      if (frame % 300 === 0 && speed < 9) speed += .4;

      plane.x += plane.vx;
      plane.vx *= .88;
      plane.tilt = plane.vx * .04;
      plane.x = Math.max(plane.w / 2, Math.min(W - plane.w / 2, plane.x));

      obstacles.forEach(o => {
        o.y += speed;
        o.rot += o.rotSpeed;
      });
      obstacles = obstacles.filter(o => o.y < H + 60);

      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        p.vy += .15; p.life -= .025;
      });
      particles = particles.filter(p => p.life > 0);

      const px = plane.x, py = plane.y;
      const pr = 16;
      for (const o of obstacles) {
        const dx = px - o.x, dy = py - o.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < pr + o.size * .4) {
          gameOver();
          return;
        }
      }

      score = Math.floor(frame / 6);
      scoreEl.textContent = score;
    }

    function render() {
      if (shake > 0) {
        ctx.save();
        ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
        shake *= .9;
        if (shake < .5) shake = 0;
      }

      drawBackground();
      obstacles.forEach(drawObstacle);
      drawPlane(plane.x, plane.y, plane.tilt);

      particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;

      if (shake > 0) ctx.restore();
    }

    function gameOver() {
      state = 'over';
      shake = 12;
      spawnParticles(plane.x, plane.y, '#ff6b6b', 20);
      spawnParticles(plane.x, plane.y, '#ffd93d', 10);
      if (score > best) {
        best = score;
        localStorage.setItem('aeroFallBest', best);
        bestEl.textContent = 'Mejor: ' + best;
      }
      overlay.classList.remove('hidden');
      overlay.querySelector('h1').textContent = '¡Game Over!';
      overlay.querySelector('p').innerHTML =
        '<span class="final-score">' + score + '</span><br>puntos';
      playBtn.textContent = 'REINTENTAR';
      hint.style.display = 'none';
    }

    function startGame() {
      reset();
      state = 'playing';
      overlay.classList.add('hidden');
      hint.style.display = 'block';
      overlay.querySelector('h1').textContent = 'Aero Fall';
      overlay.querySelector('p').textContent = 'Esquiva los obstáculos mientras caes. ¿Cuánto aguantas?';
      playBtn.textContent = 'JUGAR';
    }

    function loop() {
      if (state === 'playing') {
        update();
        render();
      } else if (state === 'menu' || state === 'over') {
        drawBackground();
        if (state === 'menu') {
          plane.x = W / 2 + Math.sin(frame * .02) * 30;
          plane.y = H * 0.35;
          drawPlane(plane.x, plane.y, Math.sin(frame * .02) * .15);
        }
        frame++;
      }
      requestAnimationFrame(loop);
    }

    let touchSide = null;
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      if (state !== 'playing') return;
      const x = e.touches[0].clientX;
      touchSide = x < W / 2 ? 'left' : 'right';
      plane.vx += touchSide === 'left' ? -6 : 6;
    }, { passive: false });
    canvas.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
    canvas.addEventListener('touchend', () => { touchSide = null; });

    canvas.addEventListener('mousedown', e => {
      if (state !== 'playing') return;
      const x = e.clientX;
      plane.vx += x < W / 2 ? -6 : 6;
    });

    document.addEventListener('keydown', e => {
      if (state !== 'playing') return;
      if (e.key === 'ArrowLeft' || e.key === 'a') plane.vx -= 6;
      if (e.key === 'ArrowRight' || e.key === 'd') plane.vx += 6;
    });

    playBtn.addEventListener('click', startGame);

    window.addEventListener('resize', resize);
    resize();
    state = 'menu';
    loop();
  </script>
</body>
</html>
